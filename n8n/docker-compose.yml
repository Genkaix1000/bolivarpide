services:
  n8n:
    image: n8nio/n8n:latest
    container_name: bolivarpide-n8n
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      # Allow the WhatsApp workflow's Code nodes to read $env.N8N_* vars
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?set a strong password}
      # Env vars consumed by the BolivarPide WhatsApp workflow ($env.N8N_*)
      - N8N_SUPABASE_URL=${N8N_SUPABASE_URL}
      - N8N_SUPABASE_SERVICE_KEY=${N8N_SUPABASE_SERVICE_KEY}
      - N8N_APP_URL=${N8N_APP_URL:-http://host.docker.internal:3000}
      - N8N_WHATSAPP_WEBHOOK_SECRET=${N8N_WHATSAPP_WEBHOOK_SECRET}
      # OpenRouter (optional AI intent/order parsing in the WhatsApp bot)
      - N8N_OPENROUTER_API_KEY=${N8N_OPENROUTER_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data: