services:
  n8n:
    image: n8nio/n8n:latest
    container_name: bolivarpide-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?set a strong password}
      - WEBHOOK_URL=https://${N8N_PUBLIC_DOMAIN}
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data: